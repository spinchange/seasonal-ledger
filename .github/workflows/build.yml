name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyyaml python-dateutil
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"
      - run: python build.py --no-stats
      - uses: actions/upload-artifact@v4
        with:
          name: seasonal-ledger-pdf
          path: build/seasonal-ledger-*.pdf
